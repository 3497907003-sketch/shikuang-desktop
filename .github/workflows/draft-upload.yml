name: Verify reviewed Windows native-v2 artifact and upload draft only
on:
  workflow_dispatch:
    inputs:
      reviewed_build_evidence:
        description: Explicit reviewed build evidence JSON; no historical run or commit defaults
        required: true
        type: string
      reviewed_evidence_sha256:
        description: SHA256 of the exact UTF-8 evidence JSON, supplied independently of the artifact
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: verified-windows-draft-upload
  cancel-in-progress: false
jobs:
  verify-and-stage:
    # Only an explicit evidence file/SHA can select a successful immutable build.
    # Legacy artifacts lack current raw/final report bindings and are rejected.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_BUILD_EVIDENCE: ${{ inputs.reviewed_build_evidence }}
      REVIEWED_EVIDENCE_SHA256: ${{ inputs.reviewed_evidence_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: uploader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test delivery guards without any upload
        working-directory: uploader
        run: python -m unittest discover -s tests -p test_delivery.py -v
      - name: Save the exact explicitly reviewed evidence without shell interpolation
        run: |
          python - <<'PYCODE'
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'reviewed-build-evidence.json').write_bytes(
              os.environ['REVIEWED_BUILD_EVIDENCE'].encode('utf-8'))
          PYCODE
      - name: Guard build provenance and draft target
        id: guard
        run: |
          python uploader/tools/verify_windows_delivery.py guard \
            --evidence "$RUNNER_TEMP/reviewed-build-evidence.json" \
            --expected-evidence-sha256 "$REVIEWED_EVIDENCE_SHA256" \
            --output "$RUNNER_TEMP/verified-context.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.guard.outputs.source_commit }}
          persist-credentials: false
          path: verified-desktop
      - uses: actions/checkout@v4
        with:
          repository: 3497907003-sketch/shikuang-app
          ref: ${{ steps.guard.outputs.web_commit }}
          persist-credentials: false
          path: verified-web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build authoritative immutable Web asset set
        working-directory: verified-web
        run: |
          npm ci
          npm run check
          npm run build
      - name: Verify full artifact, binary, seals and two actual offline runtime phases
        run: |
          python uploader/tools/verify_windows_delivery.py verify-download \
            --context "$RUNNER_TEMP/verified-context.json" \
            --expected-evidence-sha256 "$REVIEWED_EVIDENCE_SHA256" \
            --desktop-source verified-desktop --web-dist verified-web/dist \
            --output "$RUNNER_TEMP/windows-delivery"
      - name: Upload Windows only to reviewed draft prerelease
        run: |
          python uploader/tools/verify_windows_delivery.py upload \
            --context "$RUNNER_TEMP/verified-context.json" \
            --expected-evidence-sha256 "$REVIEWED_EVIDENCE_SHA256" \
            --directory "$RUNNER_TEMP/windows-delivery"
      - name: Keep verification report even if staging fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-draft-verification
          path: ${{ runner.temp }}/windows-delivery/windows-gate-report.json
          if-no-files-found: ignore
